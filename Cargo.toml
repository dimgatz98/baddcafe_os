[package]
name = "baddcafe_os"
version = "0.1.0"
edition = "2024"

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
test-success-exit-code = 33

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader = "0.9.35"
spin = "0.12.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
