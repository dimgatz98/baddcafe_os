[package]
name = "baddcafe_os"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
test-success-exit-code = 33

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "page_fault"
harness = false

[[test]]
name = "page_fault_protection"
harness = false

[[test]]
name = "heap_no_execute"
harness = false

[dependencies]
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
spin = "0.12.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
